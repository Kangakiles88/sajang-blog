slug: closing-business-checklist
title: 폐업 신고 순서와 세금 정리, 부가세 폐업 확정신고·4대보험까지 체크리스트 (2026년 기준)
publishedOn: 2026-11-04
checkedAt: 2026-11-03
items:
  - claim: 폐업 신고 기한
    value: 폐업 후 지체 없이
    source: https://www.law.go.kr/법령/부가가치세법/제8조
    evidence: 제8조제8항 '휴업 또는 폐업을 하거나 ... 지체 없이 사업장 관할 세무서장에게 신고하여야 한다' ([시행 2026. 1. 2.] 법률 제21065호). 국세청 7780 '지체없이「휴업(폐업)신고서」에 사업자등록증을 첨부'
    status: 일치
  - claim: 홈택스·손택스 폐업 신고 경로
    value: 신청/제출 → 신청업무 → 휴폐업신고
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7780&mi=2447
    evidence: "국세청 '휴·폐업' 페이지 본문: 홈택스 '신청/제출 → 신청업무' 메뉴의 '휴폐업신고', 모바일 '국세청 손택스' 앱의 '신청/제출' 또는 '모바일 민원실'"
    status: 일치
  - claim: 통합폐업신고 가능 인허가 업종 수
    value: 138개
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7780&mi=2447
    evidence: "국세청 '휴·폐업' 페이지: '음식업, 이미용 등 공중위생업종, 의료기기업종 등 138개 인,허가 업종 ... 시군구 또는 세무서 중 한 곳에 제출'"
    status: 일치
  - claim: 폐업일 기준
    value: 실제로 영업을 그만둔 날
    source: https://www.law.go.kr/법령/부가가치세법시행령/제7조
    evidence: 시행령 제7조제1항제3호 '사업장별로 그 사업을 실질적으로 폐업하는 날. 다만, 폐업한 날이 분명하지 아니한 경우에는 ... 폐업신고서의 접수일' ([시행 2026. 2. 27.])
    status: 일치
  - claim: 폐업 시 과세기간
    value: 과세기간 시작일부터 폐업일까지
    source: https://www.law.go.kr/법령/부가가치세법/제5조
    evidence: 제5조제3항 '폐업하는 경우의 과세기간은 폐업일이 속하는 과세기간의 개시일부터 폐업일까지로 한다'
    status: 일치
  - claim: 일반과세자 2기 과세기간 시작일
    value: 7월 1일
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7693&mi=22
    evidence: 국세청 '부가가치세란?' 표 '제2기 7.1~12.31 ... 확정신고 7.1.~12.31. 법인·개인 일반사업자'
    status: 일치
  - claim: 간이과세자 과세기간 시작일
    value: 1월 1일
    source: https://www.law.go.kr/법령/부가가치세법/제5조
    evidence: "제5조제1항제1호 '간이과세자: 1월 1일부터 12월 31일까지' + 제3항(폐업일까지)"
    status: 일치
  - claim: 부가세 폐업 확정신고·납부 기한
    value: 폐업일이 속한 달의 다음 달 25일
    source: https://www.law.go.kr/법령/부가가치세법/제49조
    evidence: 제49조제1항 '(폐업하는 경우 제5조제3항에 따른 폐업일이 속한 달의 다음 달 25일) 이내에 ... 신고'. 납부는 같은 조 제2항 '확정신고서와 함께 ... 납부'
    status: 일치
  - claim: 12월 중 폐업 시 기한
    value: 2027.1.25.(월)
    source: https://www.law.go.kr/법령/부가가치세법/제49조
    evidence: 제49조제1항(다음 달 25일) 적용. 2027.1.25.은 달력상 월요일로 국세기본법 제5조 연장 대상 아님
    status: 일치
  - claim: 11월 중 폐업 시 기한
    value: 2026.12.28.(월)
    source: https://www.law.go.kr/법령/국세기본법/제5조
    evidence: 국세기본법 제5조제1항 기한이 '토요일 및 일요일', '공휴일 및 대체공휴일'이면 '그 다음날을 기한으로 한다' ([시행 2026. 10. 2.]). 원래 기한 2026.12.25.(금, 성탄절) → 12.26.(토)·12.27.(일)도 해당 → 12.28.(월)
    status: 일치
  - claim: 확정신고서로 폐업신고 갈음
    value: 폐업 연월일과 사유를 적고 사업자등록증을 붙여 내면
    source: https://www.law.go.kr/법령/부가가치세법시행령/제13조
    evidence: 시행령 제13조제3항 '확정신고서에 폐업 연월일과 그 사유를 적고 사업자등록증을 첨부하여 제출하는 경우에는 폐업신고서를 제출한 것으로 본다'
    status: 일치
  - claim: 폐업 시 잔존재화 과세
    value: 남아 있는 재화를 자기에게 공급한 것으로 본다
    source: https://www.law.go.kr/법령/부가가치세법/제10조
    evidence: 제10조제6항 '폐업할 때 자기생산ㆍ취득재화 중 남아 있는 재화는 자기에게 공급하는 것으로 본다'. 자기생산ㆍ취득재화 정의(제1항제1호) '매입세액이 공제된 재화'
    status: 일치
  - claim: 국세청 상담전화
    value: "126"
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7780&mi=2447
    evidence: 국세청 페이지 하단 '국세청 대표 상담전화는 전국 어디서나 국번 없이 126번(유료)'
    status: 일치
  - claim: 퇴직금 지급 기한
    value: 14일 이내
    source: https://www.law.go.kr/법령/근로자퇴직급여보장법/제9조
    evidence: 제9조제1항 '지급사유가 발생한 날부터 14일 이내에 퇴직금을 지급 ... 당사자 간의 합의에 따라 지급기일을 연장할 수 있다' ([시행 2026. 7. 1.])
    status: 일치
  - claim: 임금 등 금품 청산 기한
    value: 14일 이내
    source: https://www.law.go.kr/법령/근로기준법/제36조
    evidence: 제36조 '지급 사유가 발생한 때부터 14일 이내에 임금, 보상금, 그 밖의 모든 금품을 지급' ([시행 2026. 10. 8.])
    status: 일치
  - claim: 건강보험 사업장 탈퇴 신고 기한
    value: 폐업한 날부터 14일 이내
    source: https://www.law.go.kr/법령/국민건강보험법시행규칙/제3조
    evidence: 시행규칙 제3조제3항 '그 날부터 14일 이내에 ... 사업장 탈퇴신고서' 제1호 '사업장이 휴업ㆍ폐업되는 경우' ([시행 2026. 9. 28.])
    status: 일치
  - claim: 국민연금 사업장 탈퇴 신고 기한
    value: 폐업한 달의 다음 달 15일까지
    source: https://www.law.go.kr/법령/국민연금법시행규칙/제4조
    evidence: 시행규칙 제4조 '휴ㆍ폐업하거나 ... 그 사유가 발생한 날이 속하는 달의 다음 달 15일까지 ... 사업장탈퇴 신고서' ([시행 2026. 2. 13.])
    status: 일치
  - claim: 국민연금 직원 자격상실 신고 기한
    value: 상실한 달의 다음 달 15일까지
    source: https://www.law.go.kr/법령/국민연금법시행규칙/제6조
    evidence: 시행규칙 제6조제1항 '자격을 상실하면 그 사유가 발생한 날이 속하는 달의 다음 달 15일까지'
    status: 일치
  - claim: 고용·산재 보험관계 소멸일
    value: 폐업한 날의 다음 날
    source: https://www.law.go.kr/법령/고용보험및산업재해보상보험의보험료징수등에관한법률/제10조
    evidence: 제10조제1호 '사업이 폐업되거나 끝난 날의 다음 날' ([시행 2026. 10. 8.])
    status: 일치
  - claim: 고용·산재 보험관계 소멸 신고 기한
    value: 소멸한 날부터 14일 이내
    source: https://www.law.go.kr/법령/고용보험및산업재해보상보험의보험료징수등에관한법률/제11조
    evidence: 제11조제1항 '사업의 폐업ㆍ종료 등으로 ... 보험관계가 소멸한 날부터 14일 이내에 공단에 ... 소멸 신고'
    status: 일치
  - claim: 고용보험 피보험자격 상실 신고 기한
    value: 다음 달 15일까지
    source: https://www.law.go.kr/법령/고용보험법시행령/제7조
    evidence: 시행령 제7조제1항 '그 사유가 발생한 날이 속하는 달의 다음 달 15일까지' ([시행 2026. 9. 18.])
    status: 일치
  - claim: 지급명세서(근로·퇴직·원천징수 사업소득) 폐업 시 기한
    value: 다음다음 달 말일
    source: https://www.law.go.kr/법령/소득세법/제164조
    evidence: 제164조제1항 괄호 '제3호에 따른 사업소득과 제4호에 따른 근로소득 또는 퇴직소득 ... 휴업, 폐업 또는 해산한 경우에는 ... 폐업일 ... 이 속하는 달의 다음다음 달 말일' ([시행 2026. 1. 1.])
    status: 일치
  - claim: 일용근로자 지급명세서 폐업 시 기한
    value: 다음 달 말일
    source: https://www.law.go.kr/법령/소득세법/제164조
    evidence: 제164조제1항 단서 '일용근로자의 근로소득 ... (휴업, 폐업 또는 해산한 경우에는 ... 폐업일 ... 이 속하는 달의 다음 달 말일)'
    status: 일치
  - claim: 간이지급명세서 폐업 시 기한
    value: 다음 달 말일
    source: https://www.law.go.kr/법령/소득세법/제164조의3
    evidence: 제164조의3제1항 '(휴업, 폐업 또는 해산한 경우에는 ... 폐업일 ... 이 속하는 달의 다음 달 말일)', 제1호 '일용근로자가 아닌 근로자에게 지급하는 근로소득'
    status: 일치
  - claim: 종합소득세 신고 기간
    value: 2027년 5월 1일부터 5월 31일까지
    source: https://www.law.go.kr/법령/소득세법/제70조
    evidence: 제70조제1항 '그 과세기간의 다음 연도 5월 1일부터 5월 31일까지' ([시행 2026. 1. 1.] 법률 제21221호). 2027.5.31.은 월요일
    status: 일치
  - claim: 적자여도 종합소득세 신고 대상
    value: 적자가 났어도 신고 대상
    source: https://www.law.go.kr/법령/소득세법/제70조
    evidence: 제70조제1항 '(종합소득과세표준이 없거나 결손금이 있는 거주자를 포함한다)'
    status: 일치
