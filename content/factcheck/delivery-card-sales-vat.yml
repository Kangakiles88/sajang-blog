    value: 하루 0.022%
    source: https://www.law.go.kr/법령/국세기본법시행령/제27조의4
    evidence: 국세기본법 시행령 제27조의4제1항 '1일 10만분의 22의 율' (=0.022%) ([시행 2026. 2. 27.] 대통령령 제36125호)
    status: 일치
