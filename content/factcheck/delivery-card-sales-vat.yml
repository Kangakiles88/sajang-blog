slug: delivery-card-sales-vat
title: "배달앱 카드 매출 부가세 신고 주의점: 홈택스 판매(결제)대행 매출 조회와 1.3% 공제 (2027년 1월 신고)"
publishedOn: 2026-11-04
checkedAt: 2026-11-04
items:
  - claim: 확정신고·납부 기한
    value: 2027년 1월 25일(월)
    source: https://www.law.go.kr/법령/부가가치세법/제49조
    evidence: 제49조제1항 '그 과세기간이 끝난 후 25일 ... 이내에 ... 신고하여야 한다', 제2항 확정신고서와 함께 납부 ([시행 2026. 1. 2.] 법률 제21065호). 2026.12.31. 종료 후 25일 = 2027.1.25., 달력상 월요일이라 공휴일 연장 없음
    status: 일치
  - claim: 개인 일반과세자 이번 신고 과세기간
    value: 2026년 7월 1일부터 12월 31일까지
    source: https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2201&bbsId=1028&nttSn=1347790
    evidence: 국세청 보도참고자료(작성일자 2026.01.08.) 본문 '신고대상 과세기간은 개인 일반과세자의 경우 7.1.~12.31.' (제2기 확정신고 기준, 매년 동일 구조)
    status: 일치
  - claim: 신용카드매출전표 등 발행세액공제율
    value: 1.3%
    source: https://www.law.go.kr/법령/부가가치세법/제46조
    evidence: 제46조제1항제3호 '발급금액 또는 결제금액의 1퍼센트(2026년 12월 31일까지는 1.3퍼센트로 한다)' ([시행 2026. 1. 2.] 법률 제21065호)
    status: 일치
  - claim: 발행세액공제 연간 한도
    value: 연간 1천만 원
    source: https://www.law.go.kr/법령/부가가치세법/제46조
    evidence: 제46조제1항제3호 '연간 500만원을 한도로 하되, 2026년 12월 31일까지는 연간 1천만원을 한도로 한다'
    status: 일치
  - claim: 특례 종료(2026.12.31.) 후 법 본문 기본 공제율·한도
    value: 1%와 연간 500만 원
    source: https://www.law.go.kr/법령/부가가치세법/제46조
    evidence: 제46조제1항제3호 괄호 '연간 500만원을 한도로 하되, 2026년 12월 31일까지는 ...' 및 '1퍼센트(2026년 12월 31일까지는 1.3퍼센트로 한다)'
    status: 일치
  - claim: 발행세액공제 제외 개인사업자 기준
    value: 10억 원 초과
    source: https://www.law.go.kr/법령/부가가치세법시행령/제88조
    evidence: 법 제46조제1항제1호가목 '법인사업자와 직전 연도의 ... 공급가액의 합계액이 대통령령으로 정하는 금액을 초과하는 개인사업자는 제외' + 시행령 제88조제3항 '사업장을 기준으로 10억원' ([시행 2026. 2. 27.] 대통령령 제36133호)
    status: 일치
  - claim: 플랫폼·결제대행업체의 자료 제출 기한
    value: 매 분기 말일의 다음 달 15일
    source: https://www.law.go.kr/법령/부가가치세법/제75조
    evidence: 제75조제1항 '판매 또는 결제를 대행하거나 중개하는 경우 ... 관련 명세를 매 분기 말일의 다음 달 15일까지 ... 제출' (제1호 통신판매 중개 부가통신사업자, 제2호 결제대행업체, 제3호 전자금융업자). 시행령 제121조제1항 '월별 거래 명세를 매 분기 말일의 다음 달 15일까지 ... 전자적 방법으로 제출'
    status: 일치
