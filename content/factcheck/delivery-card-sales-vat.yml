    evidence: 국세청 보도참고자료(2026.01.08.) 참고3 미리채움 표 'No.4 신용카드 매출 26.1.14.'
    status: 일치
  - claim: 미리채움 판매·결제대행자료 제공일(2026년 1월 신고 기준)
    value: 1월 16일
    source: https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2201&bbsId=1028&nttSn=1347790
    evidence: 국세청 보도참고자료(2026.01.08.) 참고3 미리채움 표 'No.5 판매·결제대행자료 26.1.16.'
    status: 일치
  - claim: 과소신고 가산세율(일반)
    value: 10%
    source: https://www.law.go.kr/법령/국세기본법/제47조의3
    evidence: "국세기본법 제47조의3제1항제2호 '제1호 외의 경우: 과소신고납부세액등의 100분의 10' ([시행 2026. 10. 2.] 법률 제21987호)"
    status: 일치
  - claim: 과소신고 가산세율(부정행위)
    value: 40%
    source: https://www.law.go.kr/법령/국세기본법/제47조의3
    evidence: 국세기본법 제47조의3제1항제1호가목 '부정행위로 인한 과소신고납부세액등의 100분의 40(역외거래 ... 100분의 60)'
    status: 일치
