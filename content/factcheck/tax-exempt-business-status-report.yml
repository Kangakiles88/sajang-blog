    evidence: "'용역제공 금액이 연간 일정규모(2천4백만원) 이상인 대리운전기사, 퀵서비스배달원 등의 인적용역사업자'"
    status: 일치
  - claim: 신고 제외(복권·우유 등 소매, 방문판매원)
    value: 복권·우유·연탄·우표·인지
    source: https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2201&bbsId=1028&nttSn=1348061
    evidence: 사업장 현황신고 대상자 표 '(신고 제외) … 복권‧우유‧연탄‧우표‧인지 등 소매업 종사 면세사업자, 보험 모집수당을 받는 자, 음료품 배달원 및 방문판매원 등'
    status: 일치
  - claim: 홈택스 신고 경로
    value: 사업장 현황신고/내역조회
    source: https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2201&bbsId=1028&nttSn=1348061
    evidence: "'홈택스 로그인 ‣ 증명‧등록‧신청 ‣ 소득･법인세 관련 신청･신고 ‣ 사업장현황 신고 ‣ 사업장 현황신고 /내역조회'"
    status: 일치
