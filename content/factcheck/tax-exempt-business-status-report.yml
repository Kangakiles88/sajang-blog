slug: tax-exempt-business-status-report
title: "면세사업자 사업장현황신고 기한과 방법: 2027년 2월 10일까지, 가산세 0.5% 정리 (2026년 귀속)"
publishedOn: 2026-11-18
checkedAt: 2026-11-18
items:
  - claim: 사업장현황신고 기한(2026년 귀속)
    value: 2027년 2월 10일(수)까지
    source: https://www.law.go.kr/법령/소득세법/제78조
    evidence: 제78조제1항 '해당 과세기간의 다음 연도 2월 10일까지 … 신고'. 2027-02-10은 수요일(달력 계산)
    status: 일치
  - claim: 폐업·휴업 사업자 포함
    value: 폐업하거나 휴업한 사업자도 대상
    source: https://www.law.go.kr/법령/소득세법/제78조
    evidence: 제78조제1항 '사업자(해당 과세기간 중 사업을 폐업 또는 휴업한 사업자를 포함한다)'
    status: 일치
  - claim: 과세·면세 겸업자 신고 간주
    value: 면세 부분은 사업장현황신고를 한 것으로 봅니다
    source: https://www.law.go.kr/법령/소득세법/제78조
    evidence: 제78조제1항제2호 단서 '면세사업 수입금액 등을 신고하는 경우에는 그 면세사업등에 대하여 사업장 현황신고를 한 것으로 본다'
    status: 일치
  - claim: 신고 제외자(납세조합·보험설계사·음료품 배달)
    value: 납세조합에 가입해 수입금액을 신고한 사람
    source: https://www.law.go.kr/법령/소득세법시행령/제141조
    evidence: 시행령 제141조제4항제1~3호 '납세조합에 가입해 수입금액을 신고한 자', 보험 모집수당, 음료품 계약배달 판매
    status: 일치
  - claim: 사업장별 신고
    value: 사업장마다 따로 신고
    source: https://www.law.go.kr/법령/소득세법시행령/제141조
    evidence: 시행령 제141조제3항 '2이상의 사업장이 있는 사업자는 각 사업장별로 사업장현황신고를 하여야 한다'
    status: 일치
  - claim: 신고서 기재 사항
    value: 결제수단별 수입금액
    source: https://www.law.go.kr/법령/소득세법시행령/제141조
    evidence: 시행령 제141조제2항제1·2호 '수입금액의 결제수단별 내역', '계산서ㆍ세금계산서ㆍ신용카드매출전표 및 현금영수증 수취내역'
    status: 일치
  - claim: 전자계산서 전송분 합계표 면제
    value: 내지 않아도 됩니다(소득세법 제163조제5항)
    source: https://www.law.go.kr/법령/소득세법/제163조
    evidence: 제163조제5항제2호 '전자계산서를 발급하거나 발급받고 전자계산서 발급명세를 … 전송한 경우에는 매출ㆍ매입처별 계산서합계표'는 제출하지 아니할 수 있음
    status: 일치
  - claim: 매입처별 세금계산서합계표 제출기한
    value: 사업장현황신고 기한까지 냅니다
    source: https://www.law.go.kr/법령/소득세법/제163조의2
    evidence: 제163조의2제1항 '제78조에 따른 사업장 현황신고기한 … 까지 매입처별 세금계산서합계표를 … 제출'
    status: 일치
  - claim: 계산서합계표 제출기한
    value: 2027년 2월 10일
    source: https://www.law.go.kr/법령/소득세법시행령/제212조
    evidence: 시행령 제212조제1항 '사업자는 법 제78조에 따른 기한까지 … 매출ㆍ매입처별계산서합계표를 제출'
    status: 일치
  - claim: 사업장현황신고 불성실 가산세율
    value: 0.5%
    source: https://www.law.go.kr/법령/소득세법/제81조의3
    evidence: 제81조의3제1항 '신고하지 아니한 수입금액 또는 미달하게 신고한 수입금액의 1천분의 5'. 국세청 개요 페이지도 '0.5%'
    status: 일치
  - claim: 현황신고 불성실 가산세 대상 업종
    value: 의료업·수의업·약국만
    source: https://www.law.go.kr/법령/소득세법시행령/제147조의2
    evidence: 시행령 제147조의2 '「의료법」에 따른 의료업, 「수의사법」에 따른 수의업 및 「약사법」에 따라 약국을 개설하여 약사에 관한 업을 행하는 사업자'
    status: 일치
  - claim: 합계표 미제출 가산세율
    value: 공급가액의 0.5%
    source: https://www.law.go.kr/법령/소득세법/제81조의10
    evidence: 제81조의10제1항제2호가목·제3호가목 '공급가액의 1천분의 5'. 국세청 개요 '공급가액의 0.5%'
    status: 일치
  - claim: 기한 후 1개월 이내 제출 가산세율
    value: 0.3%
    source: https://www.law.go.kr/법령/소득세법/제81조의10
    evidence: 제81조의10제1항제2호가목·제3호가목 괄호 '제출기한이 지난 후 1개월 이내에 제출하는 경우에는 공급가액의 1천분의 3'
    status: 일치
  - claim: 소규모사업자 수입금액 기준
    value: 4천8백만 원
    source: https://www.law.go.kr/법령/소득세법시행령/제147조의6
    evidence: 시행령 제147조의6제1항제2호 '간편장부대상자로서 직전 과세기간의 사업소득의 수입금액이 4천8백만원에 미달하는 사업자', 제1호(법 제73조제1항제4호, 사업소득 연말정산), 제3호(신규 개시)
    status: 일치
  - claim: 가산세 한도(중소기업)
    value: 5천만 원
    source: https://www.law.go.kr/법령/국세기본법/제49조
    evidence: 제49조제1항 '의무위반의 종류별로 각각 5천만원(… 중소기업이 아닌 기업은 1억원)을 한도', 제1호에 소득세법 제81조의3·제81조의10 포함, 단서 '고의적으로 위반한 경우에는 그러하지 아니하다'
    status: 일치
  - claim: 국세청 보도참고자료 날짜
    value: 2026년 1월 19일
    source: https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2201&bbsId=1028&nttSn=1348061
    evidence: 보도참고자료 상단 '보도 시점 2026. 1. 19.(월) 10:00'
    status: 일치
  - claim: 2025년 귀속 안내 대상 인원
    value: 167만 명
    source: https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2201&bbsId=1028&nttSn=1348061
    evidence: 본문 첫 단락 '부가가치세 면세사업자(167만 명)*에게 ’25년 귀속 사업장 현황신고 안내문을 모바일을 통해 발송'
    status: 일치
  - claim: 인적용역사업자 안내 기준 금액
    value: 2천4백만 원
