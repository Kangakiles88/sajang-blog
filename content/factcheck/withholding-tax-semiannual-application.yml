slug: withholding-tax-semiannual-application
title: "원천세 반기납부 신청 방법과 승인 조건: 12월 31일까지, 상시고용 20명 이하 (2027년 상반기분)"
publishedOn: 2026-11-21
checkedAt: 2026-11-21
items:
  - claim: 반기납부 상시고용인원 기준
    value: 20명 이하
    source: https://www.law.go.kr/법령/소득세법시행령/제186조
    evidence: 시행령 제186조제1항제1호 '직전 연도 … 의 상시고용인원이 20명 이하인 원천징수의무자(금융 및 보험업을 경영하는 자는 제외한다)'. 시행 2026.10.1. 대통령령 제36737호 기준
    status: 일치
  - claim: 평균 상시고용인원 계산 기간
    value: 1월부터 12월까지 매월 말일 현재 인원
    source: https://www.law.go.kr/법령/소득세법시행령/제186조
    evidence: 시행령 제186조제2항 '직전 연도의 1월부터 12월까지의 매월 말일 현재의 상시고용인원의 평균인원수로 한다'
    status: 일치
  - claim: 평균 계산 예시 결과(본문 예시, 시행령 방식 적용)
    value: 20명
    source: https://www.law.go.kr/법령/소득세법시행령/제186조
    evidence: "제186조제2항의 매월 말일 평균 방식 적용: (22명×4+19명×8)÷12=240÷12=20명, 제1항제1호 '20명 이하'에 해당"
    status: 일치
  - claim: 2027년 상반기분 반기납부 신청 기간
    value: 2026년 12월 1일부터 31일까지
    source: https://www.law.go.kr/법령/소득세법시행령/제186조
    evidence: 시행령 제186조제3항 '반기별로 납부하고자 하는 반기의 직전월의 1일부터 말일까지 원천징수 관할세무서장에게 신청'. 상반기(1월 시작)의 직전월은 12월
    status: 일치
  - claim: 2027년 하반기분 신청 기간
    value: 2027년 6월 1일부터 30일까지
    source: https://www.law.go.kr/법령/소득세법시행령/제186조
    evidence: 시행령 제186조제3항 '반기의 직전월의 1일부터 말일까지'. 하반기(7월 시작)의 직전월은 6월
    status: 일치
  - claim: 12월 신청분 승인 통지 기한
    value: 2027년 1월 31일
    source: https://www.law.go.kr/법령/소득세법시행령/제186조
    evidence: 시행령 제186조제4항 '신청일이 속하는 반기의 다음 달 말일까지 통지', '기한 내에 승인 여부를 통지받지 못한 경우에는 승인받은 것으로 본다'. 12월은 하반기 → 다음 달 1월 말일
    status: 일치
  - claim: 6월 신청분 승인 통지 기한
    value: 2027년 7월 31일
    source: https://www.law.go.kr/법령/소득세법시행령/제186조
    evidence: 시행령 제186조제4항 '신청일이 속하는 반기의 다음 달 말일까지'. 6월은 상반기 → 다음 달 7월 말일
    status: 일치
  - claim: 매월 납부 원칙 기한
    value: 다음 달 10일
    source: https://www.law.go.kr/법령/소득세법/제128조
    evidence: 제128조제1항 '그 징수일이 속하는 달의 다음 달 10일까지'. 소득세법 시행 2026.7.1. 법률 제21221호 기준
    status: 일치
  - claim: 반기납부 기한
    value: 반기의 마지막 달의 다음 달 10일
    source: https://www.law.go.kr/법령/소득세법/제128조
    evidence: 제128조제2항 '그 징수일이 속하는 반기의 마지막 달의 다음 달 10일까지 납부할 수 있다'
    status: 일치
  - claim: 2026년 12월분 원천세 납부 기한
    value: 2027년 1월 11일
    source: https://www.law.go.kr/법령/국세기본법/제5조
    evidence: 소득세법 제128조제1항 다음 달 10일 → 2027-01-10은 일요일. 국세기본법 제5조제1항제1호 '토요일 및 일요일' → '그 다음날을 기한으로 한다' → 1월 11일(월)
    status: 일치
  - claim: 2027년 상반기분 반기 납부 기한
    value: 2027년 7월 12일
    source: https://www.law.go.kr/법령/국세기본법/제5조
    evidence: 소득세법 제128조제2항 반기 마지막 달(6월)의 다음 달 10일 → 2027-07-10 토요일, 7-11 일요일. 국세기본법 제5조제1항제1호에 따라 다음날 → 7월 12일(월)
    status: 일치
  - claim: 2027년 하반기분 반기 납부 기한
    value: 2028년 1월 10일
    source: https://www.law.go.kr/법령/소득세법/제128조
    evidence: 제128조제2항 반기 마지막 달(12월)의 다음 달 10일 → 2028-01-10(월요일, 공휴일 아님)
    status: 일치
  - claim: 지방소득세 특별징수 비율
    value: 소득세의 10%
    source: https://www.law.go.kr/법령/지방세법/제103조의13
    evidence: 제103조의13제1항 '원천징수하는 소득세 … 의 100분의 10에 해당하는 금액을 … 개인지방소득세로 특별징수'. 지방세법 시행 2026.7.1. 법률 제21308호
    status: 일치
  - claim: 지방소득세 반기 납부 기한
    value: 반기 마지막 달의 다음 달 10일
    source: https://www.law.go.kr/법령/지방세법/제103조의13
    evidence: 제103조의13제2항 단서 '「소득세법」 제128조제2항에 따라 … 반기별로 납부하는 경우에는 반기의 마지막 달의 다음 달 10일까지 … 납부할 수 있다'
    status: 일치
  - claim: 일용근로자 지급명세서 제출 기한
    value: 지급한 달의 다음 달 말일
    source: https://www.law.go.kr/법령/소득세법/제164조
    evidence: 제164조제1항 단서 '일용근로자의 근로소득의 경우에는 그 지급일이 속하는 달의 다음 달 말일 … 까지 지급명세서를 제출'
    status: 일치
  - claim: 근로소득 지급명세서(연간) 제출 기한
    value: 다음 연도 3월 10일
    source: https://www.law.go.kr/법령/소득세법/제164조
    evidence: 제164조제1항 괄호 '제4호에 따른 근로소득 또는 퇴직소득 … 의 경우에는 다음 연도 3월 10일'
    status: 일치
  - claim: 상용근로자 간이지급명세서 매월 제출 시행
    value: 2027년 1월 1일 지급분부터
    source: https://www.law.go.kr/법령/소득세법/제164조의3
    evidence: "제164조의3제1항 '소득 지급일 … 이 속하는 달의 다음 달 말일까지', 제1호 '일용근로자가 아닌 근로자에게 지급하는 근로소득', 부칙 표시 '[시행일: 2027. 1. 1.] 제164조의3제1항 중 \"제1호의 소득\"의 개정부분'"
    status: 일치
  - claim: 반기납부 사업장 간이지급명세서 가산세 유예 기한
    value: 2028년 12월 31일
    source: https://www.law.go.kr/법령/소득세법/제81조의11
    evidence: 제81조의11제3항제1호 '2027년 1월 1일부터 2027년 12월 31일(제128조제2항에 따라 원천징수세액을 반기별로 납부하는 원천징수의무자의 경우에는 2028년 12월 31일)까지 … 반기의 마지막 달의 다음 달 말일 … 까지 제출하는 경우' 가산세 부과하지 아니함
    status: 일치
  - claim: 일반 사업장 간이지급명세서 유예 기한
    value: 2027년 12월 31일
    source: https://www.law.go.kr/법령/소득세법/제81조의11
    evidence: 제81조의11제3항제1호 '2027년 1월 1일부터 2027년 12월 31일 … 까지'
    status: 일치
  - claim: 반기 신고서 작성(6개월 합산)
    value: 6개월
    source: https://t.nts.go.kr/bundang/na/ntt/selectNttInfo.do?nttSn=143576&mi=8915
    evidence: "분당세무서 공지(2018.6.25.) '① 신고구분 : 반기란에 표시', 간이세액 총지급액 '6개월간 지급한 총지급액을 합산하여 기재', '⑥ 징수세액 : … 6개월간의 징수세액의 합계액 기재'"
    status: 일치
  - claim: 홈택스 신청 메뉴
    value: 원천징수세액 반기별 납부승인신청
    source: https://mediahub.seoul.go.kr/archives/1262120
    evidence: 서울시 마을세무사 칼럼(발행 2019.12.20.) '12월 31일까지 홈택스 … 신청/제출의 원천징수세액 반기별 납부승인신청을 통해 신청'. 2019년 자료라 본문에 연도 명시
    status: 일치
