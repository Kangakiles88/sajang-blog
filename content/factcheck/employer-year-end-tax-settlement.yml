slug: employer-year-end-tax-settlement
title: "직원 연말정산 사장님 할 일: 2월 급여 정산, 3월 10일 원천세 신고·지급명세서 (2026년 귀속)"
publishedOn: 2026-11-17
checkedAt: 2026-11-16
items:
  - claim: 연말정산 시기
    value: 2027년 2월분 급여를 줄 때
    source: https://www.law.go.kr/법령/소득세법/제137조
    evidence: 제137조제1항 '해당 과세기간의 다음 연도 2월분의 근로소득 또는 퇴직자의 퇴직하는 달의 근로소득을 지급할 때'
    status: 일치
  - claim: 추가 납부세액 분납 기준
    value: 10만 원을 넘으면
    source: https://www.law.go.kr/법령/소득세법/제137조
    evidence: 제137조제4항 '추가 납부세액이 10만원을 초과하는 경우'
    status: 일치
  - claim: 분납 기간
    value: 4월분 급여
    source: https://www.law.go.kr/법령/소득세법/제137조
    evidence: 제137조제4항 '다음 연도 2월분부터 4월분의 근로소득을 지급할 때까지 … 나누어 원천징수할 수 있다'
    status: 일치
  - claim: 공제신고서 미제출 시 적용 공제
    value: 본인 기본공제와 표준세액공제만
    source: https://www.law.go.kr/법령/소득세법/제137조
    evidence: 제137조제3항 '기본공제 중 그 근로소득자 본인에 대한 분과 표준세액공제만을 적용'
    status: 일치
  - claim: 공제신고서 제출 기한
    value: 2월분 급여를 받기 전까지
    source: https://www.law.go.kr/법령/소득세법/제140조
    evidence: 제140조제1항 '다음 연도 2월분의 근로소득을 받기 전(퇴직한 경우에는 퇴직한 날이 속하는 달의 근로소득을 받기 전)'
    status: 일치
  - claim: 원천징수영수증 발급 기한
    value: 다음 연도 2월 말일
    source: https://www.law.go.kr/법령/소득세법/제143조
    evidence: 제143조제1항 '해당 과세기간의 다음 연도 2월 말일까지 … 원천징수영수증을 근로소득자에게 발급'
    status: 일치
  - claim: 중도퇴사자 원천징수영수증 발급 기한
    value: 다음 달 말일까지
    source: https://www.law.go.kr/법령/소득세법/제143조
    evidence: 제143조제1항 단서 '퇴직한 날이 속하는 달의 근로소득의 지급일이 속하는 달의 다음 달 말일까지'
    status: 일치
  - claim: 원천세 납부 기한
    value: 2027년 3월 10일(수)
    source: https://www.law.go.kr/법령/소득세법/제128조
    evidence: 제128조제1항 '그 징수일이 속하는 달의 다음 달 10일까지'. 2월 징수분이므로 3월 10일(2027-03-10은 수요일)
    status: 일치
  - claim: 반기납부자 납부 기한
    value: 7월 10일
    source: https://www.law.go.kr/법령/소득세법/제128조
    evidence: 제128조제2항 '그 징수일이 속하는 반기의 마지막 달의 다음 달 10일까지'
    status: 일치
  - claim: 반기납부 요건
    value: 20명 이하
    source: https://www.law.go.kr/법령/소득세법시행령/제186조
    evidence: 시행령 제186조제1항제1호 '직전 연도 … 상시고용인원이 20명 이하인 원천징수의무자(금융 및 보험업을 경영하는 자는 제외한다)'
    status: 일치
  - claim: 연말정산 환급 방법
    value: 재정경제부령에 정한 별도 절차로 환급
    source: https://www.law.go.kr/법령/소득세법시행령/제201조
    evidence: 시행령 제201조 ① '원천징수하여 납부할 소득세에서 조정하여 환급' ② '납부할 소득세가 없는 때에는 재정경제부령이 정하는 바에 의하여 환급'
    status: 일치
  - claim: 근로소득 지급명세서 제출 기한
    value: 다음 연도 3월 10일
    source: https://www.law.go.kr/법령/소득세법/제164조
    evidence: 제164조제1항 '다음 연도 2월 말일(… 제4호에 따른 근로소득 또는 퇴직소득 … 의 경우에는 다음 연도 3월 10일 …)'
    status: 일치
  - claim: 지급명세서 제출 방법
    value: 전자적 저장매체
    source: https://www.law.go.kr/법령/소득세법/제164조
    evidence: 제164조제3항 '정보통신망에 의하여 제출하거나 디스켓 등 전자적 정보저장매체로 제출'
    status: 일치
  - claim: 폐업 시 지급명세서 기한
    value: 폐업일이 속한 달의 다음다음 달 말일
    source: https://www.law.go.kr/법령/소득세법/제164조
    evidence: 제164조제1항 괄호 '휴업, 폐업 또는 해산한 경우에는 휴업일, 폐업일 또는 해산일이 속하는 달의 다음다음 달 말일'
    status: 일치
  - claim: 근로소득 간이지급명세서 매월 제출 시행
    value: 2027년 1월 1일 지급분부터
    source: https://www.law.go.kr/법령/소득세법/제164조의3
    evidence: "제164조의3제1항 '소득 지급일 … 이 속하는 달의 다음 달 말일까지', 제1호 '일용근로자가 아닌 근로자에게 지급하는 근로소득', 부칙 표시 '[시행일: 2027. 1. 1.] 제164조의3제1항 중 \"제1호의 소득\"의 개정부분'"
    status: 일치
  - claim: 간이지급명세서 가산세 유예
    value: 2028년 12월 31일까지
    source: https://www.law.go.kr/법령/소득세법/제81조의11
    evidence: 제81조의11제3항제1호 '2027년 1월 1일부터 2027년 12월 31일(… 반기별로 납부하는 원천징수의무자의 경우에는 2028년 12월 31일)까지 … 반기의 마지막 달의 다음 달 말일 … 까지 제출하는 경우'
    status: 일치
  - claim: 지급명세서 미제출 가산세율
    value: 1%
    source: https://www.law.go.kr/법령/소득세법/제81조의11
    evidence: 제81조의11제1항제1호가목 '제출하지 아니한 분의 지급금액의 100분의 1'
    status: 일치
  - claim: 기한 후 3개월 이내 제출 가산세율
    value: 0.5%
    source: https://www.law.go.kr/법령/소득세법/제81조의11
    evidence: 제81조의11제1항제1호가목 괄호 '제출기한이 지난 후 3개월 이내에 제출하는 경우에는 지급금액의 1천분의 5'
    status: 일치
  - claim: 원천징수 납부지연가산세 기본분
    value: 3%
    source: https://www.law.go.kr/법령/국세기본법/제47조의5
    evidence: 제47조의5제1항제1호 '납부하지 아니한 세액 또는 과소납부분 세액의 100분의 3'
    status: 일치
  - claim: 납부지연 일수분 이자율
    value: 하루 0.022%
    source: https://www.law.go.kr/법령/국세기본법시행령/제27조의4
    evidence: 시행령 제27조의4제1항 '1일 10만분의 22의 율'
    status: 일치
  - claim: 3%+일수분 합계 한도
    value: 10%
    source: https://www.law.go.kr/법령/국세기본법/제47조의5
    evidence: 제47조의5제1항 본문 '(제1호의 금액과 제2호의 금액을 합한 금액은 100분의 10)'
    status: 일치
  - claim: 지급명세서 가산세 한도
    value: 중소기업 5천만 원
    source: https://www.law.go.kr/법령/국세기본법/제49조
    evidence: 제49조제1항 '각각 5천만원(… 중소기업이 아닌 기업은 1억원)을 한도 … 고의적으로 위반한 경우에는 그러하지 아니하다', 제1호 '소득세법 … 제81조의11'
    status: 일치
  - claim: "예시: 급여 3,600만 원 지급명세서 3개월 내 지연"
    value: 18만 원
    source: https://www.law.go.kr/법령/소득세법/제81조의11
    evidence: "제81조의11제1항제1호가목 1천분의 5 적용: 36,000,000 × 0.005 = 180,000 (계산기 테스트 1과 같음)"
    status: 일치
  - claim: "예시: 원천세 30만 원 30일 지연"
    value: 1만 980원
    source: https://www.law.go.kr/법령/국세기본법/제47조의5
    evidence: "제47조의5제1항제1·2호와 시행령 제27조의4: 300,000×3%=9,000, 300,000×30×0.00022=1,980, 합계 10,980 (한도 30,000 미만)"
    status: 일치
  - claim: 2026년 간소화 서비스 개통일
    value: 1월 15일
    source: https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=&nttSn=1347979
    evidence: 국세청 보도참고자료(2026.1.14.) 제목·본문 '연말정산 간소화 서비스를 1월 15일(목) 개통합니다'
    status: 일치
  - claim: 최종 확정자료 제공일
    value: 1월 20일
    source: https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=&nttSn=1347979
    evidence: 같은 자료 '최종 확정자료는 1.20.(화)부터 제공'
    status: 일치
  - claim: 부양가족 소득 기준
    value: 100만 원(근로소득만 있으면 총급여 500만 원)
    source: https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=&nttSn=1347979
    evidence: 같은 자료 '소득금액 100만원(근로소득만 있는 경우 총급여 500만원)을 초과하는 부양가족', 참고2 '인적공제 대상 아님'
    status: 일치
