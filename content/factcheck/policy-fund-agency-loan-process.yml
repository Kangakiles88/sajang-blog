slug: policy-fund-agency-loan-process
title: "소상공인 정책자금 대리대출 절차: 확인서 발급부터 보증서·은행 대출까지 (2026년 공고 기준)"
publishedOn: 2026-11-17
checkedAt: 2026-11-16
items:
