    value: 7천만 원
    source: https://www.sbiz24.kr/#/pbanc/679
    evidence: "공고문(중기부 공고 제2026-271호, 2026.4.16.) 6쪽 일반경영안정자금 '대출한도 : 연간 7천만원'"
    status: 일치
  - claim: 일반경영안정자금 금리
    value: 기준금리 + 0.6%p
    source: https://www.sbiz24.kr/#/pbanc/679
    evidence: "공고문(중기부 공고 제2026-271호, 2026.4.16.) 6쪽 '대출금리(변동금리) : 정책자금 기준금리 + 0.6%p'"
