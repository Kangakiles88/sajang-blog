slug: vat-january-filing-guide
title: 1월 부가세 확정신고, 개인사업자 혼자 홈택스로 하는 법 (2027년 1월 25일 마감)
publishedOn: 2026-11-06
checkedAt: 2026-11-03
items:
  - claim: 확정신고·납부 기한(과세기간 종료 후)
    value: 2027년 1월 25일(월)
    source: https://www.law.go.kr/법령/부가가치세법/제49조
    evidence: 제49조제1항 '그 과세기간이 끝난 후 25일 ... 이내에 ... 신고하여야 한다' ([시행 2026. 1. 2.] 법률 제21065호). 국세청 7693 표 제2기 확정신고 '다음해 1.1.~1.25.'. 2027.1.25.은 달력상 월요일이라 공휴일 연장 없음
    status: 일치
  - claim: 개인 일반과세자 이번 신고 과세기간
    value: 2026.7.1.~2026.12.31.
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7693&mi=22
    evidence: 국세청 '부가가치세란?' 과세기간 표 '제2기 7.1~12.31 확정신고 7.1.~12.31. 다음해 1.1.~1.25. 법인·개인 일반사업자'
    status: 일치
  - claim: 간이과세자 과세기간
    value: 2026.1.1.~2026.12.31.
    source: https://www.law.go.kr/법령/부가가치세법/제5조
    evidence: "제5조제1항제1호 '간이과세자: 1월 1일부터 12월 31일까지'. 국세청 7693 간이과세자 표 '1.1.~12.31. 다음해 1.1.~1.25.'"
    status: 일치
  - claim: 간이과세자 신고 기한
    value: 2027.1.25.(월)
    source: https://www.law.go.kr/법령/부가가치세법/제67조
    evidence: 제67조제1항 '과세기간이 끝난 후 25일 ... 이내에 ... 확정신고를 하고 ... 납부'
    status: 일치
  - claim: 간이과세자 납부의무 면제 기준
    value: 4,800만 원 미만
    source: https://www.law.go.kr/법령/부가가치세법/제69조
    evidence: 제69조제1항 '공급대가의 합계액이 4천800만원 미만이면 ... 납부의무를 면제한다'
    status: 일치
  - claim: 예정고지 금액
    value: 직전 6개월 납부세액의 50%
    source: https://www.law.go.kr/법령/부가가치세법/제48조
    evidence: 제48조제3항 '직전 과세기간에 대한 납부세액 ... 의 50퍼센트 ... 로 결정하여 ... 징수한다'. 국세청 7693 '직전 과세기간(6개월) 납부세액의 50%를 예정고지서(4월·10월)에 의해 납부'
    status: 일치
  - claim: 예정고지 미징수 기준
    value: 50만 원 미만
    source: https://www.law.go.kr/법령/부가가치세법/제48조
    evidence: 제48조제3항 단서 제1호 '징수하여야 할 금액이 50만원 미만인 경우' 징수하지 아니함
    status: 일치
  - claim: 예정고지세액 확정신고 시 차감
    value: 이미 낸 세금으로 빠집니다
