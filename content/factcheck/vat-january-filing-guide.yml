    evidence: 법 제46조제1항제1호가목 '직전 연도의 ... 공급가액의 합계액이 대통령령으로 정하는 금액을 초과하는 개인사업자는 제외' + 시행령 제88조제3항 '사업장을 기준으로 10억원' ([시행 2026. 2. 27.] 대통령령 제36133호)
