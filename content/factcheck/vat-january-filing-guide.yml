    evidence: 시행령 제104조의5제3항 '부가가치세법 제49조에 따른 확정신고 및 같은 법 제67조에 따른 신고', 제4항 '대통령령으로 정하는 금액이란 5천원' <개정 2026. 2. 27.> ([시행 2026. 9. 18.] 대통령령 제36587호)
