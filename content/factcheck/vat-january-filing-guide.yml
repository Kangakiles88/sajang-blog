    evidence: 제46조제1항제3호 '발급금액 또는 결제금액의 1퍼센트(2026년 12월 31일까지는 1.3퍼센트로 한다)'
    status: 일치
  - claim: 신용카드 매출전표 등 발행세액공제 한도
