slug: interim-income-tax-prepayment
title: 종합소득세 중간예납 고지서, 11월 30일까지 얼마 내나요? 추계액 신고·분납 정리 (2026년)
publishedOn: 2026-11-13
checkedAt: 2026-11-13
items:
  - claim: 기준 법령 시행일
    value: 2026년 11월 기준 소득세법
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0065&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 소득세법 조문 상단 '[시행 2026. 1. 1.] [법률 제21221호]', 시행령 제140조 상단 '[시행 2026. 10. 1.] [대통령령 제36737호]', 국세기본법 제5조 상단 '[시행 2026. 10. 2.] [법률 제21987호]'
    status: 일치
  - claim: 중간예납 대상 기간
    value: 올해 상반기(1월 1일~6월 30일)
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0065&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제65조① '1월 1일부터 6월 30일까지의 기간을 중간예납기간으로'. 국세청 7673 페이지 '올해 상반기(1.1.~6.30)의 소득세를 11월에 내는 것'
    status: 일치
  - claim: 중간예납세액
    value: 중간예납기준액의 2분의 1
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0065&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제65조① '중간예납기준액의 2분의 1에 해당하는 금액(… 1천원 미만의 단수가 있을 때에는 그 단수금액은 버린다)'
    status: 일치
  - claim: 중간예납기준액 구성
    value: 작년 중간예납세액, 5월 확정신고 때 낸 세액, 나중에 추가로 낸 세액을 더하고 돌려받은 환급세액을 뺀 금액
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0065&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제65조⑦ 제1호 직전 과세기간의 중간예납세액, 제2호 확정신고납부세액, 제3호 추가납부세액, 제4호 기한후신고납부세액 등의 합계액에서 제85조 환급세액을 공제
    status: 일치
  - claim: 고지서 발급 기간
    value: 11월 1일부터 15일 사이에 고지서를 보내고
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0065&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제65조① 후단 '11월 1일부터 11월 15일까지의 기간에 중간예납세액의 납부고지서를 발급'
    status: 일치
  - claim: 납부기한
    value: 2026년 11월 30일(월)
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7675
    evidence: "제65조① '11월 30일까지 그 세액을 징수'. 국세청 7675 페이지 '자진 납부기한 : 2026.11.30.(월)'"
    status: 일치
  - claim: 소액부징수 기준
    value: 50만 원 미만이면 아예 걷지 않습니다
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0086&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제86조 제4호 '제65조에 따른 중간예납세액이 50만원 미만인 경우'. 국세청 7673 '소액부징수자 중간예납세액이 50만원 미만인 경우'
    status: 일치
  - claim: 확정신고 때 중간예납세액 공제
    value: 2027년 5월 종합소득세 확정신고 때 기납부세액으로 빠집니다
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0076&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제76조③ '확정신고납부를 할 때에는 다음 각 호의 세액을 공제하여 납부한다' 제1호 '제65조에 따른 중간예납세액'
    status: 일치
  - claim: "제외 대상: 신규사업자"
    value: 2025년 12월 31일에는 사업자가 아니었고 2026년에 새로 사업을 시작한 사람
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7673
    evidence: 국세청 7673 표 '신규사업자 2025.12.31. 현재 사업자가 아닌 자로서 2026년 중 신규로 사업을 개시한 사람'
    status: 일치
  - claim: "제외 대상: 휴·폐업자"
    value: 2026년 6월 30일 이전에 휴업하거나 폐업한 사람
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7673
    evidence: 국세청 7673 표 '휴·폐업자 2026.6.30. 이전 휴·폐업자'
    status: 일치
  - claim: "제외 대상: 특정 소득만 있는 사람"
    value: 2025년 귀속 사업소득을 연말정산한 방문판매원
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7673
    evidence: 국세청 7673 '다음의 소득만이 있는 사람' 칸. 시행령 제123조 제1호·제3호의2와도 일치
    status: 일치
  - claim: 추계액 신고 요건
    value: 30%에 못 미치면
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0065&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제65조③ '중간예납기준액의 100분의 30에 미달하는 경우에는 11월 1일부터 11월 30일까지의 기간에 … 신고할 수 있다'. 국세청 7675 '30%에 미달하는 경우 → 신고·납부할 수 있음'
    status: 일치
  - claim: 추계액 신고 기간
    value: 11월 1일부터 30일 사이에 추계액으로 신고
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0065&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제65조③ '11월 1일부터 11월 30일까지의 기간에'. ④ '신고를 한 경우에는 제1항에 따른 중간예납세액의 결정은 없었던 것으로 본다'
    status: 일치
  - claim: 추계액 계산식
    value: 과세표준 × 기본세율(6~45%)
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7675
    evidence: 국세청 7675 '중간예납추계액의 계산' 1~3단계. ①은 제65조⑧ 제1호와도 일치
    status: 일치
  - claim: "예시: 과세표준 850만 원에 적용되는 세율"
    value: 6%
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7675
    evidence: 국세청 7675 기본세율표 '1,400만원 이하 6%'. 500만×2−150만=850만, ×6%=51만, ÷2=25만 5천, 300만×30%=90만 (계산)
    status: 일치
  - claim: 추계액 50만 원 미만이어도 신고서 제출 필요
    value: 추계액 신고서를 꼭 내야
    source: https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7675
    evidence: 국세청 7675 '중간예납추계액이 50만원 미만인 경우 납부대상이 아니나, 추계액 신고서를 반드시 제출하여야 중간예납 고지세액을 취소할 수 있음'
    status: 일치
  - claim: 복식부기의무자 추계액 신고 의무
    value: 추계액을 스스로 신고·납부해야 합니다
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0065&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제65조⑤ '중간예납기준액이 없는 거주자 중 … 복식부기의무자가 … 사업소득이 있는 경우에는 … 신고하여야 한다'
    status: 일치
  - claim: 분납 가능 기준
    value: 1천만 원을 넘으면
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0077&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제77조 '납부할 세액이 각각 1천만원을 초과하는 자는 … 납부기한이 지난 후 2개월 이내에 분할납부할 수 있다'. 국세청 7675 '추계액 신고·납부하는 경우에도 … 1천만원을 초과하는 경우 분납가능'
    status: 일치
  - claim: 분납할 수 있는 금액
    value: 세액의 50% 이하
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=290841&joNo=0140&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 시행령 제140조 제1호 '2천만원이하인 때에는 1천만원을 초과하는 금액', 제2호 '2천만원을 초과하는 때에는 그 세액의 100분의 50이하의 금액'
    status: 일치
  - claim: 분납 마감일
    value: 2027년 2월 1일(월)
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=289999&joNo=0005&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제77조 '납부기한이 지난 후 2개월 이내' → 2027.1.30.(토). 국세기본법 제5조① '기한이 … 토요일 및 일요일 … 그 다음날을 기한으로'. 1.31.(일)도 해당해 2.1.(월). 요일은 달력으로 확인
    status: 일치
  - claim: 분납분 미납 시 재고지 기간
    value: 2027년 1월 1일~15일
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=280405&joNo=0065&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 제65조② '다음 연도 1월 1일부터 1월 15일까지의 기간에 그 분할납부할 수 있는 세액을 납부할 세액으로 하는 납부고지서를 발급'
    status: 일치
  - claim: 납부기한 연장 사유
    value: 장사에 큰 손실이 났거나 재난·질병 등으로
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=290683&joNo=0013&joBrNo=00&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 국세징수법 제13조① 제1호~제3호, ② 관할 세무서장에게 신청
    status: 일치
  - claim: 납부지연가산세
    value: 3%
    source: https://www.law.go.kr/LSW//lsSideInfoP.do?lsiSeq=289999&joNo=0047&joBrNo=04&docCls=jo&urlMode=lsScJoRltInfoR
    evidence: 국세기본법 제47조의4① 제3호 '지정납부기한까지 납부하지 아니한 세액 … × 100분의 3'. 납부에 '중간예납' 포함(①본문)
    status: 일치
