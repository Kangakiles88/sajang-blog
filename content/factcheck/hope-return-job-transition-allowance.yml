slug: hope-return-job-transition-allowance
title: "희망리턴패키지 전직장려수당 신청 조건과 금액: 최대 100만 원, 심화교육 수료가 먼저 (2026년 공고 기준)"
publishedOn: 2026-11-16
checkedAt: 2026-11-16
items:
  - claim: 전직장려수당 최대 금액
    value: 최대 100만 원
    source: https://www.sbiz24.kr/#/pbanc/592
    evidence: 공고문(붙임1, 2026.4.22. 수정) 사업개요 '③전직장려수당(최대 100만원)', 지원내용 '1차60만원 + 2차40만원'
    status: 일치
  - claim: 1차 전직장려수당 금액·요건
    value: 60만 원
    source: https://www.sbiz24.kr/#/pbanc/592
    evidence: 공고문(붙임1, 2026.4.22. 수정) ③전직장려수당 세부요건 표 '1차(60만원) … ’25-‘26년 취업 심화교육 수료'
    status: 일치
  - claim: 2차 전직장려수당 금액·근속 기준
    value: 상시직으로 고용보험 가입 기간 60일 이상
    source: https://www.sbiz24.kr/#/pbanc/592
    evidence: 공고문(붙임1, 2026.4.22. 수정) 세부요건 표 '2차(40만원) … 상시직으로 고용보험 가입(근속)기간이 60일 이상', 변경표 '60일(2개월) 이상 근속'
    status: 일치
  - claim: 2025년 기준(비교)
