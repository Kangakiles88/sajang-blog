    source: https://www.sbiz24.kr/#/pbanc/592
    evidence: 공고문(붙임1, 2026.4.22. 수정) ‘26년 주요 변경사항 표 2025년 '(1차) 심화교육, 취업완료 등 구직 / (2차) 취업 후 30일 이상 근속'
    status: 일치
