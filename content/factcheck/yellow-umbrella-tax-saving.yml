slug: yellow-umbrella-tax-saving
title: 노란우산공제 소득공제 한도, 사업소득 구간별 600만·500만·400만·200만 원 (2026년 납입분)
publishedOn: 2026-11-05
checkedAt: 2026-11-05
items:
  - claim: 사업소득금액 4천만 원 이하 공제 한도
    value: 600만 원
    source: https://www.law.go.kr/법령/조세특례제한법/제86조의3
    evidence: "제86조의3제1항제1호 '사업소득금액이 4천만원 이하인 경우: 600만원' ([시행 2026. 9. 18.] 현행)"
    status: 일치
  - claim: 1구간 기준 사업소득금액
    value: 4,000만 원 이하
    source: https://www.law.go.kr/법령/조세특례제한법/제86조의3
    evidence: 제86조의3제1항제1호 '4천만원 이하'
    status: 일치
  - claim: 사업소득금액 4천만 원 초과 6천만 원 이하 공제 한도
    value: 500만 원
    source: https://www.law.go.kr/법령/조세특례제한법/제86조의3
    evidence: "제86조의3제1항제2호 '4천만원 초과 6천만원 이하인 경우: 500만원'"
    status: 일치
  - claim: 2구간 기준 사업소득금액
    value: 6,000만 원 이하
    source: https://www.law.go.kr/법령/조세특례제한법/제86조의3
    evidence: 제86조의3제1항제2호 '6천만원 이하'
    status: 일치
  - claim: 사업소득금액 6천만 원 초과 1억 원 이하 공제 한도
    value: 400만 원
    source: https://www.law.go.kr/법령/조세특례제한법/제86조의3
    evidence: "제86조의3제1항제3호 '6천만원 초과 1억원 이하인 경우: 400만원'"
    status: 일치
  - claim: 사업소득금액 1억 원 초과 공제 한도
    value: 200만 원
    source: https://www.law.go.kr/법령/조세특례제한법/제86조의3
    evidence: "제86조의3제1항제4호 '사업소득금액이 1억원 초과인 경우: 200만원'"
    status: 일치
  - claim: 새 한도 적용 시기
    value: 2025년 과세기간에 납부하는 공제부금부터
    source: https://www.law.go.kr/법령/조세특례제한법
    evidence: 부칙 <법률 제20778호, 2025. 3. 14.> 제1조 '공포한 날부터 시행', 제11조① '제86조의3제1항의 개정규정은 이 법 시행일이 속하는 과세기간에 납부하는 공제부금부터 적용'
    status: 일치
  - claim: 법인 대표자 근로소득금액 기준 적용 요건
    value: 총급여가 8,000만 원 이하
    source: https://www.law.go.kr/법령/조세특례제한법/제86조의3
    evidence: 제86조의3제1항 '법인의 대표자로서 해당 과세기간의 총급여액이 8천만원 이하인 거주자의 경우에는 근로소득금액으로 한다'
    status: 일치
  - claim: 지방소득세 감소분(소득세 감소분 대비)
    value: 10%
    source: https://www.law.go.kr/법령/지방세법/제92조
    evidence: 지방세법 제92조제1항 세율표(시행 2026.1.1.) '1천400만원 이하 과세표준의 1천분의 6', '1천분의 15', '1천분의 24', '1천분의 35' 등 — 소득세법 제55조 세율의 10분의 1
    status: 일치
  - claim: 종합소득세율 1,400만 원 이하
    value: 6%
    source: https://www.law.go.kr/법령/소득세법/제55조
    evidence: 소득세법 제55조제1항 세율표(시행 2026.1.1.) '1,400만원 이하 과세표준의 6퍼센트'
    status: 일치
  - claim: 종합소득세율 1,400만 원 초과 5,000만 원 이하
    value: 15%
    source: https://www.law.go.kr/법령/소득세법/제55조
    evidence: 제55조제1항 세율표 '1,400만원 초과 5,000만원 이하 84만원+(1,400만원 초과 금액의 15퍼센트)'
    status: 일치
  - claim: 종합소득세율 5,000만 원 초과 8,800만 원 이하
    value: 24%
    source: https://www.law.go.kr/법령/소득세법/제55조
    evidence: 제55조제1항 세율표 '5,000만원 초과 8,800만원 이하 624만원+(5,000만원 초과 금액의 24퍼센트)'
    status: 일치
  - claim: 종합소득세율 8,800만 원 초과 1억5천만 원 이하
    value: 35%
    source: https://www.law.go.kr/법령/소득세법/제55조
    evidence: 제55조제1항 세율표 '8,800만원 초과 1억5천만원 이하 1,536만원+(8,800만원 초과 금액의 35퍼센트)'
    status: 일치
  - claim: 종합소득세 최고세율
    value: 45%
    source: https://www.law.go.kr/법령/소득세법/제55조
    evidence: 제55조제1항 세율표 '10억원 초과 ... 10억원을 초과하는 금액의 45퍼센트'
    status: 일치
  - claim: "예시1: 4,000만 원·600만 원 납입·15% 절세액"
    value: 99만 원
    source: https://www.law.go.kr/법령/조세특례제한법/제86조의3
    evidence: "계산값: 한도 600만원(제1항제1호) × 15%(소득세법 제55조) = 90만원 + 지방소득세 9만원(지방세법 제92조) = 99만원. 계산기 tests 1번과 같음"
    status: 일치
  - claim: "예시2: 6,000만 원·600만 원 납입·24% 절세액"
    value: 132만 원
    source: https://www.law.go.kr/법령/조세특례제한법/제86조의3
    evidence: "계산값: 한도 500만원(제1항제2호) × 24% = 120만원 + 12만원 = 132만원. 계산기 tests 3번과 같음"
    status: 일치
  - claim: "예시3: 1억 원 초과·300만 원 납입·35% 절세액"
    value: 77만 원
    source: https://www.law.go.kr/법령/조세특례제한법/제86조의3
    evidence: "계산값: 한도 200만원(제1항제4호) × 35% = 70만원 + 7만원 = 77만원. 계산기 tests 5번과 같음"
    status: 일치
  - claim: 경영악화 해지 시 퇴직소득 과세 요건(납입월수)
    value: 120개월 이상
    source: https://www.law.go.kr/법령/조세특례제한법/제86조의3
    evidence: 제86조의3제4항제2호가목 '공제부금 납입월수가 120개월 이상인 ... 가입자가 대통령령으로 정하는 경영악화를 사유로 계약을 해지한 경우'
    status: 일치
  - claim: 경영악화 해지 특례 시행일
    value: 2025년 7월 1일
    source: https://www.law.go.kr/법령/조세특례제한법
    evidence: 부칙 <법률 제20778호, 2025. 3. 14.> 제1조 단서 '제86조의3제4항의 개정규정은 2025년 7월 1일부터 시행한다'
    status: 일치
  - claim: 종합소득세 확정신고 기간
    value: 다음 연도 5월 1일부터 5월 31일까지
    source: https://www.law.go.kr/법령/소득세법/제70조
    evidence: 소득세법 제70조제1항(시행 2026.1.1.) '그 과세기간의 다음 연도 5월 1일부터 5월 31일까지 ... 신고하여야 한다'
    status: 일치
