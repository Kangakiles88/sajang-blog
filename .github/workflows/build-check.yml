# 풀 리퀘스트에서 빌드가 깨지지 않는지 확인합니다. (main 푸시는 deploy.yml이 빌드·배포까지 합니다)
name: 빌드 확인

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
