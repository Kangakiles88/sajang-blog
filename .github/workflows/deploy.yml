# GitHub에 푸시할 때마다 사이트를 빌드해서 Cloudflare에 배포합니다.
# 매일 아침에도 한 번 배포해서, 날짜를 정해 둔 예약 글이 그날 공개되게 합니다.
# 필요한 비밀값 (Settings > Secrets and variables > Actions > Repository secrets):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 21 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 비밀값 확인
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error title=비밀값 없음::CLOUDFLARE_API_TOKEN 이 비어 있습니다. Settings > Secrets and variables > Actions > Repository secrets 에 넣으세요."; exit 1; fi
          if [ -z "$ACCOUNT" ]; then echo "::error title=비밀값 없음::CLOUDFLARE_ACCOUNT_ID 가 비어 있습니다. Repository secrets 에 넣으세요."; exit 1; fi
          if ! [[ "$ACCOUNT" =~ ^[0-9a-f]{32}$ ]]; then echo "::error title=계정 ID 형식 오류::CLOUDFLARE_ACCOUNT_ID 는 32자리 영문 소문자·숫자여야 합니다. 공백이나 다른 값이 들어갔는지 확인하세요."; exit 1; fi
          echo "비밀값 형식 정상"
      - name: Cloudflare에 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4.154.0 deploy 2>&1 | tee deploy.log; then
            msg=$(grep -E 'ERROR|Authentication|code: [0-9]+|not authorized|permission' deploy.log | tail -6 | tr '\n' ' ')
            echo "::error title=Cloudflare 배포 실패::${msg:-로그를 확인하세요}"
            exit 1
          fi
